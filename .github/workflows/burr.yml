name: Burr assembly checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  assemblies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: fraylabs/burr-action@7a5130f1f849759a681d25364d53acf30dfe2d00
        id: burr
        with:
          comment: 'false'
          files: models/clearance-check.step
          generate-accepted-fits: 'true'
      - uses: actions/upload-artifact@v4
        if: always() && steps.burr.outputs.report-path != ''
        with:
          name: burr-reports
          path: ${{ steps.burr.outputs.report-path }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.burr.outputs.accepted-draft-path != ''
        with:
          name: accepted-draft
          path: ${{ steps.burr.outputs.accepted-draft-path }}
