name: Burr incomplete geometry proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  incomplete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: fraylabs/burr-action@v1
        id: burr
        with:
          files: models/incomplete-camera.step
      - uses: actions/upload-artifact@v4
        if: always() && steps.burr.outputs.report-path != ''
        with:
          name: burr-incomplete-report
          path: ${{ steps.burr.outputs.report-path }}
